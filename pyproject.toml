[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "oto-coach"
version = "0.1.0"
description = "Oto（音）— a Japanese learning skill for Mandarin speakers, from zero kana through JLPT N3."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Oto contributors"}]
keywords = ["japanese", "jlpt", "pitch-accent", "education", "mandarin", "skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Japanese",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
audio = ["numpy>=1.24", "soundfile>=0.12"]
tts = ["pyopenjtalk-plus>=0.4.1", "numpy>=1.24"]
plot = ["matplotlib>=3.7", "numpy>=1.24"]
praat = ["praat-parselmouth>=0.4.3", "numpy>=1.24"]
score = ["hatsuon>=0.1.2", "librosa>=0.10", "soundfile>=0.12", "onnxruntime>=1.17", "soxr>=0.3"]
dict = ["jamdict>=0.1a11", "jamdict_data>=1.5"]
anki = ["genanki>=0.13"]
asr = ["faster-whisper>=1.1.0"]
teach = [
    "numpy>=1.24",
    "soundfile>=0.12",
    "matplotlib>=3.7",
    "pyopenjtalk-plus>=0.4.1",
]
dev = ["pytest>=8"]

[project.scripts]
oto = "oto.cli:main"

[project.urls]
Homepage = "https://github.com/chongchonghaoman/oto-coach"
Source = "https://github.com/chongchonghaoman/oto-coach"

[tool.hatch.build.targets.wheel]
packages = ["src/oto"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "oto/data"
"SKILL.md" = "oto/SKILL.md"

[tool.hatch.build.targets.sdist]
include = [
    "src/oto",
    "data",
    "tests",
    "assets/brand",
    "SKILL.md",
    "README.md",
    "README.en.md",
    "LICENSE",
    "LICENSE-CONTENT",
    "CONTRIBUTING.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: real audio backends; skipped when the extra is not installed",
]
addopts = "-q"
