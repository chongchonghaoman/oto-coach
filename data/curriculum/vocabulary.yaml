    items:
      - {id: v-keiken, jp: 経験, reading: けいけん, pos: 名词, zh: 经验, example: いい経験をしました。, example_reading: いいけいけんをしました。, example_zh: 是一次好的经历。}
      - {id: v-iken, jp: 意見, reading: いけん, pos: 名词, zh: 意见、看法, example: 意見を言います。, example_reading: いけんをいいます。, example_zh: 说出看法。, note_zh: 中性。不一定是批评。}
      - {id: v-riyuu, jp: 理由, reading: りゆう, pos: 名词, zh: 理由, example: 理由を説明します。, example_reading: りゆうをせつめいします。, example_zh: 说明理由。}
      - {id: v-setsumei, jp: 説明, reading: せつめい, pos: 名词, zh: 说明, example: もう一度説明してください。, example_reading: もういちどせつめいしてください。, example_zh: 请再说明一次。}
