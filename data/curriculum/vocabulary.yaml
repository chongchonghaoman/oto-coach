      - {id: v-seikatsu, jp: 生活, reading: せいかつ, pos: 名词, zh: 生活, example: 日本の生活に慣れました。, example_reading: にほんのせいかつになれました。, example_zh: 习惯了在日本的生活。}
      - {id: v-shakai, jp: 社会, reading: しゃかい, pos: 名词, zh: 社会, example: 社会の問題です。, example_reading: しゃかいのもんだいです。, example_zh: 是社会问题。}
      - {id: v-kenkyuu, jp: 研究, reading: けんきゅう, pos: 名词, zh: 研究, example: 日本語を研究しています。, example_reading: にほんごをけんきゅうしています。, example_zh: 在研究日语。}
