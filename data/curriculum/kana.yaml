- id: kana-timing
  level: zero
  domain: kana
  order: 40
  title_zh: 促音、长音、拨音
  title_ja: 促音・長音・撥音
  prerequisites:
  - kana-yoon
  summary_zh: 这三样决定拍数。中文母语者最容易在时间上省掉它们。
  items:
  - id: kana-sokuon
    jp: っ
    katakana: ッ
    reading: っ
    romaji: （促音）
    zh: 促音独占一拍。きて（来て）两拍，きって（切手）三拍。写小，并且靠右、靠下。
    note_zh: 它不是重读符号。闭住气流，停满一拍。
  - id: kana-choon
    jp: おう
    katakana: オー
    reading: おう
    romaji: ō
    zh: 长音再给一拍。平假名里おう、おお常表示长 o，えい常表示长 e。片假名用ー。
    note_zh: おばさん四拍，おばあさん五拍。拍数变了，词就变了。
  - id: kana-hatsuon
    jp: ん
    katakana: ン
    reading: ん
    romaji: n
    zh: 拨音是一拍。位置随后面的音变化：ぱ前接近 m，か前接近 ng，词尾可以是成音节的 n。
    note_zh: 不要把它写成前一个汉字的韵尾就结束。ほん是两拍。
  - id: kana-yoon-concept
    jp: しゃ
    katakana: シャ
    reading: しゃ
    romaji: sha
    zh: 拗音是一拍。小ゃ、ゅ、ょ贴在前一个假名上。写的时候比正常假名小。
    note_zh: きょう是两拍：きょ、う。不是三拍。
