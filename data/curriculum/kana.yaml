units:
- id: kana-gojuon
  level: zero
  domain: kana
  order: 10
  title_zh: 清音五十音
  title_ja: 五十音
  prerequisites: []
  summary_zh: 平假名和片假名一起记。目标是拍，不是普通话的音节。ゐ、ゑ只作历史知识，不进这张表。
  items:
  - id: kana-a
    jp: あ
    katakana: ア
    reading: あ
    romaji: a
    zh: 嘴自然张开，比「啊」更短、更轻。不要拖长。
    row: あ
  - id: kana-i
    jp: い
    katakana: イ
    reading: い
    romaji: i
    zh: 嘴角向两边，比普通话「衣」更紧、更短。
    row: い
  - id: kana-u
    jp: う
    katakana: ウ
    reading: う
    romaji: u
    zh: 不圆唇。不要发成「乌」。双唇放松。
    row: う
  - id: kana-e
    jp: え
    katakana: エ
    reading: え
    romaji: e
    zh: 介于「诶」和「哎」之间，口型稳定，不要滑向い。
    row: え
  - id: kana-o
    jp: お
    katakana: オ
    reading: お
    romaji: o
    zh: 嘴唇圆，但比普通话「欧」短。不要收成う。
    row: お
  - id: kana-ka
    jp: か
    katakana: カ
    reading: か
    romaji: ka
    zh: か行。气流比普通话 k 弱。
    row: か
  - id: kana-ki
    jp: き
    katakana: キ
    reading: き
    romaji: ki
    zh: き。い的口型加上弱的 k。后面接清音时，い可能几乎不响。
    row: き
  - id: kana-ku
    jp: く
    katakana: ク
    reading: く
    romaji: ku
    zh: く。う不圆唇，所以く也不要撮嘴。
    row: く
  - id: kana-ke
    jp: け
    katakana: ケ
    reading: け
    romaji: ke
    zh: け。え的口型要稳定。
    row: け
  - id: kana-ko
    jp: こ
    katakana: コ
    reading: こ
    romaji: ko
    zh: こ。お短而圆。
    row: こ
  - id: kana-sa
    jp: さ
    katakana: サ
    reading: さ
    romaji: sa
    zh: さ。舌尖靠近上齿龈，气流摩擦，不要发成英语 th。
    row: さ
  - id: kana-shi
    jp: し
    katakana: シ
    reading: し
    romaji: shi
    zh: 接近「西」，不是「思」。不要用舌尖音 si。
    row: し
  - id: kana-su
    jp: す
    katakana: ス
    reading: す
    romaji: su
    zh: す。嘴唇不圆。不要发成「苏」。
    row: す
  - id: kana-se
    jp: せ
    katakana: セ
    reading: せ
    romaji: se
    zh: せ。摩擦弱而短。
    row: せ
  - id: kana-so
    jp: そ
    katakana: ソ
    reading: そ
    romaji: so
    zh: そ。注意片假名ソ和ン的方向不同。
    row: そ
  - id: kana-ta
    jp: た
    katakana: タ
    reading: た
    romaji: ta
    zh: た。不送气，气流比普通话 t 弱。
    row: た
  - id: kana-chi
    jp: ち
    katakana: チ
    reading: ち
    romaji: chi
    zh: ち。不送气的 [tɕi]，不要发成送气的「吃」或 ci。
    row: ち
  - id: kana-tsu
    jp: つ
    katakana: ツ
    reading: つ
    romaji: tsu
    zh: つ。不圆唇，气流比「粗」弱。片假名ツ比シ多一笔方向要分开。
    row: つ
  - id: kana-te
    jp: て
    katakana: テ
    reading: て
    romaji: te
    zh: て。短。
    row: て
  - id: kana-to
    jp: と
    katakana: ト
    reading: と
    romaji: to
    zh: と。片假名ト和汉语「卜」不同。
    row: と
  - id: kana-na
    jp: な
    katakana: ナ
    reading: な
    romaji: na
    zh: な行是鼻音加元音，舌尖贴上齿龈。
    row: な
  - id: kana-ni
    jp: に
    katakana: ニ
    reading: に
    romaji: ni
    zh: に。
    row: に
  - id: kana-nu
    jp: ぬ
    katakana: ヌ
    reading: ぬ
    romaji: nu
    zh: ぬ。う不圆唇。平假名ぬ和め要分开。
    row: ぬ
  - id: kana-ne
    jp: ね
    katakana: ネ
    reading: ね
    romaji: ne
    zh: ね。
    row: ね
  - id: kana-no
    jp: の
    katakana: ノ
    reading: の
    romaji: 'no'
    zh: の。片假名ノ只有一笔。
    row: の
  - id: kana-ha
    jp: は
    katakana: ハ
    reading: は
    romaji: ha
    zh: 词首是 h。作助词时读わ。这里先记词首的 ha。
    row: は
  - id: kana-hi
    jp: ひ
    katakana: ヒ
    reading: ひ
    romaji: hi
    zh: ひ。摩擦在口腔后部，不是英语 he 那么靠前。
    row: ひ
  - id: kana-fu
    jp: ふ
    katakana: フ
    reading: ふ
    romaji: fu
    zh: 双唇靠近但不咬唇，没有英语 f 的齿唇摩擦。不要发成「夫」的圆唇。
    row: ふ
  - id: kana-he
    jp: へ
    katakana: ヘ
    reading: へ
    romaji: he
    zh: 词首是 he。作助词时读え。
    row: へ
  - id: kana-ho
    jp: ほ
    katakana: ホ
    reading: ほ
    romaji: ho
    zh: ほ。
    row: ほ
  - id: kana-ma
    jp: ま
    katakana: マ
    reading: ま
    romaji: ma
    zh: ま行。双唇鼻音。
    row: ま
  - id: kana-mi
    jp: み
    katakana: ミ
    reading: み
    romaji: mi
    zh: み。
    row: み
  - id: kana-mu
    jp: む
    katakana: ム
    reading: む
    romaji: mu
    zh: む。う不圆唇。
    row: む
  - id: kana-me
    jp: め
    katakana: メ
    reading: め
    romaji: me
    zh: め。平假名め和ぬ要对照着写。
    row: め
  - id: kana-mo
    jp: も
    katakana: モ
    reading: も
    romaji: mo
    zh: も。
    row: も
  - id: kana-ya
    jp: や
    katakana: ヤ
    reading: や
    romaji: ya
    zh: や行只有や、ゆ、よ。没有 yi、ye。
    row: や
  - id: kana-yu
    jp: ゆ
    katakana: ユ
    reading: ゆ
    romaji: yu
    zh: ゆ。嘴唇不要收成普通话 ü。
    row: ゆ
  - id: kana-yo
    jp: よ
    katakana: ヨ
    reading: よ
    romaji: yo
    zh: よ。
    row: よ
  - id: kana-ra
    jp: ら
    katakana: ラ
    reading: ら
    romaji: ra
    zh: 舌尖轻弹上齿龈，不是普通话 l，也不是英语 r。
    row: ら
  - id: kana-ri
    jp: り
    katakana: リ
    reading: り
    romaji: ri
    zh: り。同样是闪音。平假名り不要写成汉语的「了」。
    row: り
  - id: kana-ru
    jp: る
    katakana: ル
    reading: る
    romaji: ru
    zh: る。不圆唇。
    row: る
  - id: kana-re
    jp: れ
    katakana: レ
    reading: れ
    romaji: re
    zh: れ。
    row: れ
  - id: kana-ro
    jp: ろ
    katakana: ロ
    reading: ろ
    romaji: ro
    zh: ろ。片假名ロ是方框，不要和口搞混。
    row: ろ
  - id: kana-wa
    jp: わ
    katakana: ワ
    reading: わ
    romaji: wa
    zh: わ。嘴唇圆度比英语 w 小。
    row: わ
  - id: kana-wo
    jp: を
    katakana: ヲ
    reading: を
    romaji: o（助词を）
    zh: 现代日语里读お，和お相同。主要用作助词を。
    row: を
  - id: kana-n
    jp: ん
    katakana: ン
    reading: ん
    romaji: n
    zh: 单独一拍。不是前一个音节的韵尾装饰。
    row: ん
- id: kana-dakuon
  level: zero
  domain: kana
  order: 20
  title_zh: 浊音和半浊音
  title_ja: 濁音・半濁音
  prerequisites:
  - kana-gojuon
  summary_zh: 点点是浊音，圆圈是半浊音。浊音要声带振动，不要只用普通话的不送气来代替。
  items:
  - id: kana-ga
    jp: が
    katakana: ガ
    reading: が
    romaji: ga
    zh: 浊音。声带要振动，不是只把 ka 的送气去掉。
    row: が
  - id: kana-gi
    jp: ぎ
    katakana: ギ
    reading: ぎ
    romaji: gi
    zh: ぎ。浊音。
    row: ぎ
