# 日语新字体、繁体、简体。kind=shinjitai 是字形对照；kind=kokuji 是国字。
entries:
  - {jp: 国, trad: 國, simp: 国, kind: shinjitai, note_zh: 新字体和简体相同。繁体是國。}
  - {jp: 学, trad: 學, simp: 学, kind: shinjitai, note_zh: 新字体和简体相同。}
  - {jp: 会, trad: 會, simp: 会, kind: shinjitai, note_zh: 新字体和简体相同。}
  - {jp: 円, trad: 圓, simp: 圆, kind: shinjitai, note_zh: 货币的圆写成円，不要写成圆或圓。}
  - {jp: 気, trad: 氣, simp: 气, kind: shinjitai, note_zh: 三者都不同。天気、元気用気。}
  - {jp: 広, trad: 廣, simp: 广, kind: shinjitai, note_zh: 不要把广写成広的替代。}
  - {jp: 写, trad: 寫, simp: 写, kind: shinjitai, note_zh: 新字体和简体相同。}
  - {jp: 対, trad: 對, simp: 对, kind: shinjitai, note_zh: 绝对、反対用対。}
  - {jp: 関, trad: 關, simp: 关, kind: shinjitai, note_zh: 関係的关是関。}
  - {jp: 帰, trad: 歸, simp: 归, kind: shinjitai, note_zh: 帰る用帰。}
  - {jp: 変, trad: 變, simp: 变, kind: shinjitai, note_zh: 変わる用変。}
  - {jp: 実, trad: 實, simp: 实, kind: shinjitai, note_zh: 実行、実は用実。}
  - {jp: 声, trad: 聲, simp: 声, kind: shinjitai, note_zh: 新字体和简体相同。}
  - {jp: 県, trad: 縣, simp: 县, kind: shinjitai, note_zh: 日本的县写成県。}
  - {jp: 転, trad: 轉, simp: 转, kind: shinjitai, note_zh: 運転する的转是転。}
  - {jp: 楽, trad: 樂, simp: 乐, kind: shinjitai, note_zh: 音楽、楽しい都用楽。}
  - {jp: 医, trad: 醫, simp: 医, kind: shinjitai, note_zh: 新字体和简体相同。医院。}
  - {jp: 当, trad: 當, simp: 当, kind: shinjitai, note_zh: 新字体和简体相同。}
  - {jp: 辺, trad: 邊, simp: 边, kind: shinjitai, note_zh: この辺用辺。}
  - {jp: 図, trad: 圖, simp: 图, kind: shinjitai, note_zh: 図書館的图是図。}
  - {jp: 団, trad: 團, simp: 团, kind: shinjitai, note_zh: 新聞の団体用団。}
  - {jp: 戦, trad: 戰, simp: 战, kind: shinjitai, note_zh: 戦争用戦。}
  - {jp: 鉄, trad: 鐵, simp: 铁, kind: shinjitai, note_zh: 地下鉄用鉄。}
  - {jp: 発, trad: 發, simp: 发, kind: shinjitai, note_zh: 出発的发是発。不要写成发或發。}
  - {jp: 読, trad: 讀, simp: 读, kind: shinjitai, note_zh: 読む用読。简体读不能直接搬进来。}
  - {jp: 売, trad: 賣, simp: 卖, kind: shinjitai, note_zh: 売る用売。}
  - {jp: 経, trad: 經, simp: 经, kind: shinjitai, note_zh: 経済用経。}
  - {jp: 駅, trad: 驛, simp: 驿, kind: shinjitai, note_zh: 车站是駅。简体驿不是日语写法。}
  - {jp: 桜, trad: 櫻, simp: 樱, kind: shinjitai, note_zh: 樱花的樱写成桜。不要写成简体樱。}
  - {jp: 歳, trad: 歲, simp: 岁, kind: shinjitai, note_zh: 何歳用歳。也见才，但歳是标准表记之一。}
  - {jp: 仮, trad: 假, simp: 假, kind: shinjitai, note_zh: 仮名的假是仮，比假少了一些笔画。}
  - {jp: 価, trad: 價, simp: 价, kind: shinjitai, note_zh: 値段的价在日语里常写価。}
  - {jp: 労, trad: 勞, simp: 劳, kind: shinjitai, note_zh: 労働用労。}
  - {jp: 仏, trad: 佛, simp: 佛, kind: shinjitai, note_zh: 仏教用仏。}
  - {jp: 歩, trad: 步, simp: 步, kind: shinjitai, note_zh: 日语是歩，下半的点和中文步不同。散步写散歩。}
  - {jp: 黒, trad: 黑, simp: 黑, kind: shinjitai, note_zh: 日语黒比黑少一点。}
  - {jp: 働, trad: null, simp: null, kind: kokuji, note_zh: 国字，意思是劳动、做工。中文用劳动，没有这个字。}
  - {jp: 込, trad: null, simp: null, kind: kokuji, note_zh: 国字。見込む、申し込む里的込む。不要自造一个汉字去对译。}
  - {jp: 畑, trad: null, simp: null, kind: kokuji, note_zh: 国字，旱田。读はたけ。}
  - {jp: 峠, trad: null, simp: null, kind: kokuji, note_zh: 国字，山路的最高处。读とうげ。}
  - {jp: 辻, trad: null, simp: null, kind: kokuji, note_zh: 国字，十字路口。读つじ。}
  - {jp: 榊, trad: null, simp: null, kind: kokuji, note_zh: 国字，一种神事用的树。读さかき。}
